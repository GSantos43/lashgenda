<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <style>
    @keyframes outerPulse {
      0% { transform: scale(0.6); opacity: 0; }
      60% { transform: scale(1.06); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes innerPop {
      0% { transform: scale(0.5); opacity: 0; }
      55% { transform: scale(1.04); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes drawTick {
      0% { stroke-dashoffset: 32; opacity: 0; }
      20% { opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 1; }
    }
    .outer-ring {
      transform-origin: 32px 32px;
      animation: outerPulse 480ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .inner-circle {
      transform-origin: 32px 32px;
      animation: innerPop 420ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .tick-path {
      stroke-dasharray: 32;
      stroke-dashoffset: 32;
      animation: drawTick 420ms 180ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
  </style>
  <circle class="outer-ring" cx="32" cy="32" r="28" fill="#10B981" fill-opacity="0.14" />
  <circle class="inner-circle" cx="32" cy="32" r="22" fill="#10B981" />
  <path
    class="tick-path"
    d="M23 32.5L29 38.5L41.5 26"
    stroke="#FFFFFF"
    stroke-width="3.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
